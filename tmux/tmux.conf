# Prefix and general settings
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g mode-keys vi

# Shift+Enter on AI TUI
set -g extended-keys on
set -g extended-keys-format csi-u
set -g focus-events on

# Vim copying
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Status line format
set -g status-position bottom
set -g status-justify left
set -g status-style "#{?client_prefix,fg=black bg=white,fg=white}"

set -g status-left " [#S]> "
set -g status-left-length 50

# set -g status-right-style "fg=white"
set -g status-right "[#H] %Y-%m-%d %H:%M "
set -g status-right-length 50

# setw -g window-status-current-style "fg=black bg=yellow"
setw -g window-status-current-format " [#I:#W #F] "
setw -g window-status-format " #I:#W #F "

# Alt+number to select window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Alt+{h,j,k,l} to select pane
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Clear scroll buffer
bind C-l clear-history

# Workmux dashboard
bind a display-popup -xC -yC -h95% -w95% -E "~/.local/bin/workmux dashboard"

# tmux-sessionizer
bind -n C-f run-shell "tmux neww ~/.local/bin/tmux-sessionizer"

# lazygit
bind j display-popup -d "#{pane_current_path}" -xC -yC -w95% -h95% -E lazygit

# newsboat
bind k display-popup -d "#{pane_current_path}" -xC -yC -w95% -h95% -E newsboat

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
vim_pattern='(\S+/)?g?\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?'
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +${vim_pattern}$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
